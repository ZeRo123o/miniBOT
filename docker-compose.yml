services:
  postgres:
    image: postgres:16-alpine
    container_name: minibot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minibot
      POSTGRES_PASSWORD: minibot
      POSTGRES_DB: minibot
    ports:
      - "5432:5432"
    volumes:
      - minibot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibot -d minibot"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minibot-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minibot
      MINIO_ROOT_PASSWORD: minibot123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minibot-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: minibot-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - minibot-milvus-etcd-data:/etcd

  milvus-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minibot-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes:
      - minibot-milvus-minio-data:/data

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: minibot-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - minibot-milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio

volumes:
  minibot-postgres-data:
  minibot-minio-data:
  minibot-milvus-etcd-data:
  minibot-milvus-minio-data:
  minibot-milvus-data:
